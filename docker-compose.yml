
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.0.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      - rabbitmq
      - kafka
    env_file:
      - .env

  worker:
    build: .
    command: celery -A app.tasks worker --loglevel=info -Q webhook_queue
    volumes:
      - .:/code
    depends_on:
      - rabbitmq
      - kafka
      - backend
    env_file:
      - .env
    restart: always

  dlq_consumer:
    build: .
    command: python -m app.kafka.dlq_consumer
    depends_on:
      - kafka
    env_file:
      - .env
    restart: on-failure

  test_runner:
    build: .
    command: ["tests/manual_dlq_test.py"]
    depends_on:
      - backend
      - kafka
      - rabbitmq
    env_file:
      - .env
